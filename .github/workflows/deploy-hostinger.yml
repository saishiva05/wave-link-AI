# Auto-deploy to Hostinger via FTP (port 21)
name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== dist/index.html ==="
          cat dist/index.html
          echo ""
          echo "=== dist contents ==="
          find dist -type f

      - name: Deploy via SSH/rsync
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USERNAME: ${{ secrets.FTP_USERNAME }}
          SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASSWORD" rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -p 65002" dist/ "$SSH_USERNAME@$SSH_HOST:/public_html/"
